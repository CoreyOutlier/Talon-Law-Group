name: Screenshots

# Visual QA helper: builds the branch, serves it, renders key pages at desktop
# and phone widths, and pushes the captures to the qa-screenshots branch
# (never to the site branches).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the site
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null
          npm i playwright@1.50.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Serve and capture
        run: |
          (npm run start -- -p 3000 > /tmp/server.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 1; done
          curl -sI http://localhost:3000/ | head -1
          mkdir -p /tmp/out
          cat > /tmp/pw/shoot.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const origin = 'http://localhost:3000';
            const pages = [['home', '/'], ['pittsburgh', '/offices/pittsburgh'], ['los-angeles', '/offices/los-angeles'], ['results', '/results'], ['car-accidents', '/practice-areas/car-accidents'], ['contact', '/contact']];
            const b = await chromium.launch();
            for (const [vw, w, h] of [['desktop', 1440, 900], ['mobile', 390, 844]]) {
              const ctx = await b.newContext({ viewport: { width: w, height: h }, reducedMotion: 'reduce', deviceScaleFactor: 1 });
              const page = await ctx.newPage();
              for (const [name, path] of pages) {
                await page.goto(origin + path, { waitUntil: 'networkidle', timeout: 90000 });
                await page.waitForTimeout(3500);
                const H = await page.evaluate(() => document.documentElement.scrollHeight);
                for (let y = 0; y < H; y += Math.round(h * 0.7)) { await page.evaluate(v => window.scrollTo(0, v), y); await page.waitForTimeout(120); }
                await page.evaluate(() => window.scrollTo(0, 0));
                await page.waitForTimeout(900);
                await page.screenshot({ path: `/tmp/out/${name}-${vw}.jpg`, fullPage: true, type: 'jpeg', quality: 72 });
                console.log('captured', name, vw, H);
              }
              // Mid-scroll frames of the pinned film sequence and the breaks on the home page.
              if (vw === 'desktop') {
                await page.goto(origin + '/', { waitUntil: 'networkidle', timeout: 90000 });
                await page.waitForTimeout(2000);
                const H = await page.evaluate(() => document.documentElement.scrollHeight);
                for (const f of [0.18, 0.24, 0.30, 0.46, 0.62, 0.80]) {
                  await page.evaluate(v => window.scrollTo(0, v), Math.round(H * f));
                  await page.waitForTimeout(700);
                  await page.screenshot({ path: `/tmp/out/home-scroll-${Math.round(f * 100)}.jpg`, type: 'jpeg', quality: 72 });
                }
              }
              await ctx.close();
            }
            await b.close();
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
          cd /tmp/pw && node shoot.js
          ls -l /tmp/out

      - name: Publish to qa-screenshots branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan qa-screenshots
          git rm -rfq . >/dev/null 2>&1 || true
          mkdir -p shots && cp /tmp/out/*.jpg shots/
          git add shots
          git commit -m "Screenshots $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin qa-screenshots
